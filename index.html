<div class="card"><h2>Komposisi bobot</h2><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div>${ring()}</div><table class="leg" style="flex:1;min-width:200px"><tbody>${D.obj.map((b,i)=>`<tr onclick="location.hash='obj-${i}'"><td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;background:var(--hue);opacity:${[1,.8,.62,.46,.32][i]}"></span>${esc(b.n)}</td><td class="r">${f(tot(objP(i)),0)}</td><td class="r mono">${f(tot(objP(i))/T*100,0)}%</td></tr>`).join('')}</tbody></table></div></div></div>
<div class="g2e"><div class="card"><h2>Paling tertinggal dari target</h2>${worst.map(n=>`<a class="row" href="#${n.id}"><span><span class="mono">${esc(n.c)}</span> <span class="lk">${esc(n.n)}</span></span>${bar(ratio(n))}<span class="r">${f(val(n))} / ${f(n.tn,0)}</span></a>`).join('')}</div>
<div class="card" id="ovp">${picCard()}</div></div>`];},
objectives(){return ['<h1>Objective</h1><div class="sub">Lima policy utama dan bobot poin prioritas di bawahnya</div>',`<div class="card">${D.obj.map((b,i)=>{const a=objP(i);return `<a class="row" style="padding:14px 0;border-bottom:1px solid var(--ln)" href="#obj-${i}"><span><span class="mono">${b.c}</span> <b class="lk">${esc(b.n)}</b><br><span class="l">${a.length} prioritas · ${D.nodes.filter(n=>n.l>1&&n.o===i).length} turunan</span></span>${bar(cap(a)/tot(a))}<span class="r">${f(cap(a),1)} / ${f(tot(a),0)}<br><span class="l">${f(cap(a)/tot(a)*100,0)}%</span></span></a>`}).join('')}</div>`]},
priorities(o){const a=o==null?L1:objP(o);return ['<h1>'+(o==null?'Prioritas':esc(D.obj[o].n))+'</h1><div class="sub">Level 1 · klik baris untuk melihat detail, turunan, dan PIC</div>',`<div class="chips"><a class="${o==null?'on':''}" href="#priorities">Semua</a>${D.obj.map((b,i)=>`<a class="${o===i?'on':''}" href="#obj-${i}">${esc(b.n)}</a>`).join('')}</div><div class="card tw"><table><thead><tr><th>Prioritas</th><th class="r">Bobot</th><th class="r">${ML||'Terakhir'}</th><th style="width:150px">Capaian</th><th>Status</th><th>PIC utama</th></tr></thead><tbody>${a.map(n=>`<tr onclick="location.hash='${n.id}'"><td>${nl(n)}</td><td class="r">${f(n.tn,0)}</td><td class="r">${f(val(n))}</td><td>${bar(ratio(n))}</td><td>${pill(n)}</td><td>${esc(plist(n.pp,2))||'–'}</td></tr>`).join('')}</tbody></table></div>`]},
tree(){const t=(n)=>{const k=kids(n.id);return k.length?`<details><summary>${nl(n)} <span class="l" style="display:inline">· ${k.length}</span></summary>${k.map(t).join('')}</details>`:`<span class="leaf">${nl(n)}</span>`};return ['<h1>Penjabaran</h1><div class="sub">Objective → prioritas → metrik → aksi. Buka cabang, klik nama untuk detail.</div>',`<div class="card">${D.obj.map((b,i)=>`<details class="t0"${i===0?' open':''}><summary><b>${b.c} ${esc(b.n)}</b></summary>${objP(i).map(t).join('')}</details>`).join('')}</div>`]},
people(){const a=D.pics.map(p=>[p,mine(p)]).sort((x,y)=>y[1].length-x[1].length),m=a[0][1].length;return ['<h1>PIC</h1><div class="sub">'+D.pics.length+' orang · klik nama untuk melihat semua item yang ditangani</div>',`<div class="card tw"><table><thead><tr><th>Nama</th><th>Dept.</th><th>Ada di matrix</th><th class="r">Utama</th><th class="r">Pendukung</th><th style="width:160px">Beban</th></tr></thead><tbody>${a.map(([p,l])=>`<tr onclick="location.hash='${p.id}'"><td><span class="nm">${av(p)}<span class="lk">${esc(p.n)}</span></span></td><td>${esc(p.d.join(', '))}</td><td>${lvb(p)}</td><td class="r">${l.filter(n=>n.pp.includes(p.id)).length}</td><td class="r">${l.filter(n=>n.sp.includes(p.id)).length}</td><td>${bar(l.length/m)}</td></tr>`).join('')}</tbody></table></div>`]},
node(n){const par=n.p?N[n.p]:null,chain=[];for(let x=par;x;x=x.p?N[x.p]:null)chain.unshift(x);const k=kids(n.id),r=ratio(n),v=val(n);
return [`<div class="crumbs"><a href="#objectives">Objective</a> › <a href="#obj-${n.o}">${esc(D.obj[n.o].n)}</a>${chain.map(x=>` › <a href="#${x.id}">${esc(x.c)}</a>`).join('')}</div><h1>${esc(n.n)}</h1><div class="sub"><span class="mono">${esc(n.c)}</span> · ${LV[n.l]}</div>`,
kp([['Target',esc(n.t||'–'),n.l===1?'bobot prioritas':''],['Terakhir',v==null?'–':f(v),li(n)<0?'':MO[li(n)]+' '+PER.y],['Capaian',r==null?'–':f(r*100,0)+'%','terhadap target'],['Status',pill(n),n.d==='le'?'lebih rendah lebih baik':''] ])+
(n.x?`<div class="card"><h2>Target to improve</h2>${esc(n.x)}</div>`:'')+
(arr(n)?`<div class="card"><h2>Capaian bulanan ${PER.y}</h2>${months(n)}</div>`:`<div class="card empty">Belum ada data bulanan ${PER.y} untuk item ini. Isi lewat kartu Ubah data di bawah.</div>`)+
`<div class="g2e"><div class="card"><h2>Penanggung jawab</h2>${[['Utama',n.pp],['Pendukung',n.sp]].map(([t,a])=>`<span class="l" style="margin:8px 0 2px">${t} · ${a.length}</span>${a.map(i=>`<a class="pl" href="#${i}">${av(P[i])}<span><span class="lk">${esc(P[i].n)}</span><br><span class="l">${esc(P[i].d.join(', '))}</span></span><span style="margin-left:auto">${lvb(P[i])}</span></a>`).join('')||'<div class="empty">–</div>'}`).join('')}</div>
<div class="card tw"><h2>${par?'Induk dan ':''}Turunan</h2>${par?`<div class="l">Induk</div><table><tbody>${rows([par])}</tbody></table><div class="l" style="margin-top:12px">Turunan · ${k.length}</div>`:''}${k.length?`<table><tbody>${rows(k)}</tbody></table>`:'<div class="empty">Tidak ada turunan.</div>'}</div></div>${editForm(n)}`]},
pic(p){const a=mine(p),u=a.filter(n=>n.pp.includes(p.id)),s=a.filter(n=>!u.includes(n)),t=(x)=>x.length?`<table><tbody>${x.map(n=>`<tr onclick="location.hash='${n.id}'"><td>${nl(n)}</td><td class="l">${LV[n.l].split(' ·')[0]}</td><td class="r">${esc(n.t||'–')}</td><td>${pill(n)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">–</div>';
return [`<div class="crumbs"><a href="#people">PIC</a></div><h1 style="display:flex;gap:12px;align-items:center">${av(p)} ${esc(p.n)}</h1><div class="sub">${esc(p.d.join(', '))} · ada di matrix ${lvb(p)}</div>`,
kp([['Utama',u.length,'item'],['Pendukung',s.length,'item'],['Level 1 / 2 / 3',[1,2,3].map(l=>a.filter(n=>n.l===l).length).join(' / '),''],['Perlu perhatian',a.filter(n=>st(n)[0]==='ba').length,'item tertinggal']])+
`<div class="card"><h2>Per objective</h2>${D.obj.map((b,i)=>{const c=a.filter(n=>n.o===i).length;return `<a class="row" href="#obj-${i}"><span class="lk">${esc(b.n)}</span>${bar(c/Math.max(1,a.length))}<span class="r">${c}</span></a>`}).join('')}</div><div class="card tw"><h2>Tanggung jawab utama</h2>${t(u)}</div><div class="card tw"><h2>Pendukung</h2>${t(s)}</div>`]}};
const NAV=[['overview','Ringkasan'],['matrix','Matrix'],['monitor','Monitor KPI'],['objectives','Objective'],['priorities','Prioritas'],['tree','Penjabaran'],['people','PIC'],['history','Riwayat']];
